# pgvitals-healthcheck.yml
#
# Copy this file to your repo at .github/workflows/pgvitals-healthcheck.yml
# to run a PostgreSQL health check on every deploy or on a schedule.
#
# The health score is posted to the GitHub Actions job summary — no external
# services, no tokens, no setup beyond a working database connection.
#
# Required secrets (set in Settings → Secrets → Actions):
#   PGHOST      — database host
#   PGPORT      — database port (default: 5432)
#   PGDATABASE  — database name
#   PGUSER      — database user
#   PGPASSWORD  — database password
#
# Optional: remove the 'schedule' trigger if you only want it on push/PR.

name: pgvitals Health Check

on:
  workflow_dispatch:          # run manually from Actions tab
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'      # every Monday at 06:00 UTC

jobs:
  health-check:
    name: PostgreSQL Health Score
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      # ── Remove this block if connecting to an external database ──────────
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # ─────────────────────────────────────────────────────────────────────

    env:
      # ── For the built-in service above ───────────────────────────────────
      PGHOST:     localhost
      PGPORT:     5432
      PGDATABASE: testdb
      PGUSER:     postgres
      PGPASSWORD: postgres
      # ── For an external database, replace with secrets: ──────────────────
      # PGHOST:     ${{ secrets.PGHOST }}
      # PGPORT:     ${{ secrets.PGPORT }}
      # PGDATABASE: ${{ secrets.PGDATABASE }}
      # PGUSER:     ${{ secrets.PGUSER }}
      # PGPASSWORD: ${{ secrets.PGPASSWORD }}
      # ─────────────────────────────────────────────────────────────────────

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run pgvitals health score
        id: health
        run: |
          # Download health_score.sql if running from a copy of this workflow
          if [ ! -f health_score.sql ]; then
            curl -sSL \
              https://raw.githubusercontent.com/pgvitals/pgvitals/master/health_score.sql \
              -o health_score.sql
          fi

          OUTPUT=$(PGPASSWORD="$PGPASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
            -f health_score.sql 2>&1)

          echo "$OUTPUT"

          # Extract the score — match "NN / 100" anywhere on the line so it
          # works regardless of psql's box-drawing borders (║ │) or alignment.
          SCORE=$(echo "$OUTPUT" | grep -oE '[0-9]+ / 100' | head -1 | grep -oE '^[0-9]+')
          [ -z "$SCORE" ] && SCORE=0

          # Derive the grade from the score (same thresholds as health_score.sql).
          if   [ "$SCORE" -ge 90 ]; then GRADE=A
          elif [ "$SCORE" -ge 75 ]; then GRADE=B
          elif [ "$SCORE" -ge 60 ]; then GRADE=C
          elif [ "$SCORE" -ge 40 ]; then GRADE=D
          else                           GRADE=F
          fi

          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "grade=$GRADE" >> "$GITHUB_OUTPUT"

          # Write to job summary
          {
            echo "## pgvitals Health Check"
            echo ""
            echo "\`\`\`"
            echo "$OUTPUT"
            echo "\`\`\`"
            echo ""
            echo "_Run against \`${PGDATABASE}\` on \`${PGHOST}\`_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate health badge
        if: always()
        run: |
          SCORE="${{ steps.health.outputs.score }}"
          GRADE="${{ steps.health.outputs.grade }}"
          [ -z "$SCORE" ] && SCORE=0
          [ -z "$GRADE" ] && GRADE=F

          # Use the bundled generator, or fetch it if running from a copied workflow.
          if [ -f runner/make_badge.py ]; then
            SCRIPT=runner/make_badge.py
          else
            curl -sSL https://raw.githubusercontent.com/pgvitals/pgvitals/master/runner/make_badge.py -o make_badge.py
            SCRIPT=make_badge.py
          fi
          python "$SCRIPT" --score "$SCORE" --grade "$GRADE" --out pgvitals-badge.svg

          {
            echo ""
            echo "**Badge generated** — download the \`pgvitals-badge\` artifact below."
            echo "To embed it, publish \`pgvitals-badge.svg\` (e.g. to a \`badges\` branch) and reference its raw URL."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload badge artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgvitals-badge
          path: pgvitals-badge.svg
          if-no-files-found: warn

      # ── Optional: publish the badge to a `badges` branch so a README can ──
      # ── embed it at a stable URL. Uncomment and ensure the workflow has   ──
      # ── `permissions: contents: write`.                                   ──
      #
      # - name: Publish badge to `badges` branch
      #   if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      #   run: |
      #     git config user.name  "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git checkout --orphan badges
      #     git rm -rf --cached . >/dev/null 2>&1 || true
      #     git add -f pgvitals-badge.svg
      #     git commit -m "Update pgvitals health badge"
      #     git push -f origin badges
      #   # Embed with:
      #   # ![pgvitals](https://raw.githubusercontent.com/<owner>/<repo>/badges/pgvitals-badge.svg)

      - name: Fail if grade is D or F
        run: |
          GRADE="${{ steps.health.outputs.grade }}"
          echo "Grade: $GRADE"
          if [[ "$GRADE" == "D" || "$GRADE" == "F" ]]; then
            echo "::error::pgvitals health grade is $GRADE — database needs attention"
            exit 1
          fi
